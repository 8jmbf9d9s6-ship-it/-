<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
<title>체리키우기 - 인트로 테스트</title>
<style>
  :root{
    --pink:#ff7f9f;
    --pink2:#ffd4df;
    --cream:#fff8ec;
    --brown:#8b5a3c;
    --sky1:#bfe8ff;
    --sky2:#fff7f0;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;overflow:hidden;background:#000;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}
  #app{position:relative;width:100%;height:100%;overflow:hidden;background:#000}
  .scene{position:absolute;inset:0;opacity:0;transition:opacity 1s ease;pointer-events:none}
  .scene.active{opacity:1;pointer-events:auto}

  /* Scene 1 */
  #darkScene{background:radial-gradient(circle at 50% 70%,#2a1720 0,#0c090b 35%,#000 75%)}
  .paw{position:absolute;font-size:32px;opacity:0;filter:drop-shadow(0 0 10px #ffd9e5);transform:scale(.8)}
  .paw.show{animation:pawPop 1.2s ease forwards}
  @keyframes pawPop{
    0%{opacity:0;transform:scale(.5)}
    35%{opacity:1;transform:scale(1.05)}
    70%{opacity:.9}
    100%{opacity:0;transform:scale(.9) translateY(-5px)}
  }
  #tapSoundText{position:absolute;left:0;right:0;bottom:14%;text-align:center;color:#ffe5ed;font-weight:700;letter-spacing:4px;opacity:0;font-size:20px}
  #tapSoundText.show{animation:fadeText 2.2s ease forwards}
  @keyframes fadeText{0%{opacity:0}30%{opacity:1}80%{opacity:1}100%{opacity:0}}

  /* Scene 2 */
  #gardenScene{
    background:
      radial-gradient(circle at 50% 16%,rgba(255,255,255,.95) 0 4%,transparent 15%),
      linear-gradient(var(--sky1) 0 45%,#dff6cf 45% 62%,#96cd76 62% 100%);
  }
  .sunGlow{position:absolute;inset:-15%;background:radial-gradient(circle at 50% 12%,rgba(255,255,255,.8),rgba(255,255,255,0) 28%);animation:glow 4s ease-in-out infinite alternate}
  @keyframes glow{from{opacity:.6}to{opacity:1}}
  .path{position:absolute;left:15%;right:15%;bottom:-5%;height:60%;background:linear-gradient(#ead6b5,#c8aa7d);clip-path:polygon(41% 0,59% 0,100% 100%,0 100%);filter:drop-shadow(0 -2px 0 rgba(255,255,255,.4))}
  .grass.left,.grass.right{position:absolute;bottom:0;width:40%;height:58%;background:linear-gradient(#a8db85,#6fbd62)}
  .grass.left{left:0;clip-path:polygon(0 0,100% 20%,75% 100%,0 100%)}
  .grass.right{right:0;clip-path:polygon(0 20%,100% 0,100% 100%,25% 100%)}
  .house{position:absolute;right:5%;top:34%;width:112px;height:92px;background:#fff0dc;border:4px solid #b86b48;border-radius:8px}
  .house:before{content:"";position:absolute;left:-8px;right:-8px;top:-38px;height:50px;background:#c66756;clip-path:polygon(50% 0,100% 70%,92% 100%,8% 100%,0 70%)}
  .house:after{content:"";position:absolute;left:41px;bottom:0;width:30px;height:48px;background:#9d664b;border-radius:12px 12px 0 0}
  .tree{position:absolute;bottom:41%;width:110px;height:180px}
  .tree.t1{left:-8px}.tree.t2{right:-10px;transform:scale(.9)}
  .trunk{position:absolute;left:45%;bottom:0;width:18px;height:75px;background:#8e5a3d;border-radius:10px}
  .crown{position:absolute;left:10px;top:5px;width:90px;height:100px;background:#f5b8ce;border-radius:50%;box-shadow:-30px 15px 0 #ffd1df,30px 15px 0 #f7c7d6,0 32px 0 #f9bace}
  .petal{position:absolute;width:10px;height:7px;background:#ffd0df;border-radius:80% 20% 80% 20%;opacity:.9;animation:fall linear infinite}
  @keyframes fall{
    0%{transform:translate3d(0,-12vh,0) rotate(0);opacity:0}
    10%{opacity:1}
    100%{transform:translate3d(var(--drift),115vh,0) rotate(420deg);opacity:.5}
  }

  /* CSS dog */
  #cherry{
    position:absolute;left:50%;bottom:15%;width:150px;height:170px;
    transform:translateX(-50%) scale(.28);opacity:0;
    transition:transform 6s cubic-bezier(.2,.8,.25,1),opacity .8s ease;
    z-index:5;
  }
  #cherry.walkIn{transform:translateX(-50%) scale(1);opacity:1}
  .body{position:absolute;left:30px;top:72px;width:95px;height:75px;background:#f3c88d;border-radius:50% 48% 48% 44%;box-shadow:inset -10px -10px 0 #e9b97d}
  .chest{position:absolute;left:24px;top:70px;width:65px;height:72px;background:#ffe3b9;border-radius:48%}
  .head{position:absolute;left:24px;top:20px;width:98px;height:92px;background:#f4ca91;border-radius:47%;box-shadow:inset 0 -9px 0 #edbd7d}
  .muzzle{position:absolute;left:28px;top:49px;width:44px;height:30px;background:#ffe6be;border-radius:50%}
  .ear{position:absolute;top:-10px;width:31px;height:45px;background:#e8b16e;clip-path:polygon(50% 0,100% 100%,0 100%)}
  .ear:after{content:"";position:absolute;left:7px;top:11px;width:17px;height:25px;background:#f7c6a5;clip-path:inherit}
  .ear.l{left:10px;transform:rotate(-12deg)} .ear.r{right:10px;transform:rotate(12deg)}
  .eye{position:absolute;top:42px;width:12px;height:14px;background:#201611;border-radius:50%}
  .eye.l{left:24px}.eye.r{right:24px}
  .eye:after{content:"";position:absolute;width:4px;height:4px;border-radius:50%;background:#fff;left:2px;top:2px}
  .nose{position:absolute;left:44px;top:57px;width:13px;height:10px;background:#241916;border-radius:50%}
  .mouth{position:absolute;left:47px;top:69px;width:8px;height:6px;border-bottom:2px solid #6d3b38;border-radius:50%}
  .leg{position:absolute;top:127px;width:22px;height:42px;background:#f0c386;border-radius:12px}
  .leg.l{left:39px}.leg.r{left:94px}
  .pawEnd{position:absolute;bottom:-3px;width:26px;height:14px;background:#ffe0b2;border-radius:50%}
  .tail{position:absolute;right:4px;top:62px;width:62px;height:62px;border:18px solid #f0c184;border-left-color:transparent;border-radius:50%;transform-origin:25% 70%;animation:tailWag .35s ease-in-out infinite alternate}
  @keyframes tailWag{from{transform:rotate(-16deg)}to{transform:rotate(16deg)}}
  #cherry.happy{animation:happyBounce .45s ease 4}
  @keyframes happyBounce{0%,100%{margin-bottom:0}50%{margin-bottom:28px}}
  #cherry.spin{animation:spinDog 1.2s ease-in-out 2}
  @keyframes spinDog{to{transform:translateX(-50%) rotateY(360deg) scale(1)}}

  .bubble{position:absolute;left:50%;bottom:47%;transform:translateX(-50%) scale(.8);padding:10px 18px;border-radius:22px;background:#fff;color:#604638;font-weight:800;opacity:0;box-shadow:0 6px 20px rgba(0,0,0,.12);z-index:10}
  .bubble.show{animation:bubblePop 1.4s ease forwards}
  @keyframes bubblePop{0%{opacity:0;transform:translateX(-50%) scale(.6)}25%{opacity:1;transform:translateX(-50%) scale(1.05)}70%{opacity:1}100%{opacity:0;transform:translateX(-50%) scale(.95)}}

  #touchHint{position:absolute;left:50%;bottom:7%;transform:translateX(-50%);padding:13px 22px;background:rgba(255,255,255,.88);border-radius:999px;color:#6d5141;font-weight:800;opacity:0;z-index:12;box-shadow:0 5px 20px rgba(0,0,0,.12)}
  #touchHint.show{animation:pulseHint 1.1s ease-in-out infinite}
  @keyframes pulseHint{0%,100%{opacity:.75;transform:translateX(-50%) scale(.98)}50%{opacity:1;transform:translateX(-50%) scale(1.04)}}

  .heart{position:absolute;font-size:25px;z-index:9;animation:heartFly 1.5s ease forwards}
  @keyframes heartFly{0%{opacity:0;transform:translateY(20px) scale(.4)}20%{opacity:1}100%{opacity:0;transform:translateY(-180px) scale(1.4) rotate(15deg)}}

  #titleWrap{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:12vh;z-index:20;opacity:0;pointer-events:none;background:linear-gradient(rgba(255,255,255,.05),rgba(255,248,238,.12))}
  #titleWrap.show{animation:titleIn 1.2s ease forwards;pointer-events:auto}
  @keyframes titleIn{to{opacity:1}}
  .cherries{font-size:56px;filter:drop-shadow(0 6px 8px rgba(0,0,0,.15));animation:bob 1.8s ease-in-out infinite}
  @keyframes bob{50%{transform:translateY(-8px)}}
  h1{margin:4px 0 4px;color:#ff6f91;font-size:clamp(42px,12vw,70px);letter-spacing:-3px;text-shadow:0 4px #fff,0 8px 18px rgba(184,75,105,.22)}
  .subtitle{background:rgba(255,255,255,.86);padding:8px 15px;border-radius:999px;color:#8c5a60;font-weight:700}
  #startBtn{margin-top:auto;margin-bottom:9vh;border:0;background:linear-gradient(#ff9ab1,#ff6f91);color:white;font-size:24px;font-weight:900;padding:17px 34px;border-radius:999px;box-shadow:0 10px 0 #d95776,0 16px 24px rgba(161,62,90,.28);cursor:pointer}
  #startBtn:active{transform:translateY(6px);box-shadow:0 4px 0 #d95776}
  #skip{position:absolute;right:18px;top:max(18px,env(safe-area-inset-top));z-index:50;color:#fff;background:rgba(0,0,0,.25);border:1px solid rgba(255,255,255,.3);border-radius:999px;padding:8px 12px;font-weight:700}
  #toast{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) scale(.8);z-index:80;padding:18px 25px;border-radius:22px;background:rgba(50,35,35,.88);color:#fff;font-weight:800;opacity:0}
  #toast.show{animation:toast 1.7s ease forwards}
  @keyframes toast{0%{opacity:0;transform:translate(-50%,-50%) scale(.7)}20%,70%{opacity:1;transform:translate(-50%,-50%) scale(1)}100%{opacity:0}}
</style>
</head>
<body>
<div id="app">
  <button id="skip">건너뛰기</button>

  <section id="darkScene" class="scene active">
    <div class="paw" style="left:40%;top:65%">🐾</div>
    <div class="paw" style="left:52%;top:54%">🐾</div>
    <div class="paw" style="left:43%;top:42%">🐾</div>
    <div class="paw" style="left:55%;top:30%">🐾</div>
    <div id="tapSoundText">톡... 톡... 톡...</div>
  </section>

  <section id="gardenScene" class="scene">
    <div class="sunGlow"></div>
    <div class="tree t1"><div class="trunk"></div><div class="crown"></div></div>
    <div class="tree t2"><div class="trunk"></div><div class="crown"></div></div>
    <div class="house"></div>
    <div class="grass left"></div><div class="grass right"></div><div class="path"></div>

    <div id="petals"></div>

    <div id="cherry" aria-label="체리 캐릭터">
      <div class="tail"></div>
      <div class="body"></div>
      <div class="chest"></div>
      <div class="head">
        <div class="ear l"></div><div class="ear r"></div>
        <div class="eye l"></div><div class="eye r"></div>
        <div class="muzzle"></div><div class="nose"></div><div class="mouth"></div>
      </div>
      <div class="leg l"><div class="pawEnd"></div></div>
      <div class="leg r"><div class="pawEnd"></div></div>
    </div>

    <div id="barkBubble" class="bubble">멍! 🐾</div>
    <div id="touchHint">화면을 터치해 주세요 ❤️</div>

    <div id="titleWrap">
      <div class="cherries">🍒</div>
      <h1>체리키우기</h1>
      <div class="subtitle">체리와 함께하는 특별한 하루</div>
      <button id="startBtn">▶ 게임 시작</button>
    </div>
  </section>

  <div id="toast">튜토리얼로 이동! 🐶</div>
</div>

<script>
const $ = s => document.querySelector(s);
const sleep = ms => new Promise(r=>setTimeout(r,ms));
let touched = false, finished = false;

function vibrate(ms=30){ if(navigator.vibrate) navigator.vibrate(ms); }

function makePetals(){
  const wrap = $('#petals');
  for(let i=0;i<28;i++){
    const p=document.createElement('i');
    p.className='petal';
    p.style.left=(Math.random()*100)+'%';
    p.style.top=(-10-Math.random()*90)+'vh';
    p.style.animationDuration=(5+Math.random()*5)+'s';
    p.style.animationDelay=(Math.random()*5)+'s';
    p.style.setProperty('--drift',(-70+Math.random()*140)+'px');
    wrap.appendChild(p);
  }
}
function hearts(){
  for(let i=0;i<14;i++){
    const h=document.createElement('div');
    h.className='heart';
    h.textContent = i%3===0 ? '💖' : '💕';
    h.style.left=(20+Math.random()*60)+'%';
    h.style.bottom=(18+Math.random()*25)+'%';
    h.style.animationDelay=(Math.random()*.4)+'s';
    $('#gardenScene').appendChild(h);
    setTimeout(()=>h.remove(),2000);
  }
}
async function runIntro(){
  const paws=[...document.querySelectorAll('.paw')];
  $('#tapSoundText').classList.add('show');
  for(const paw of paws){
    await sleep(620);
    paw.classList.add('show');
    vibrate(15);
  }
  await sleep(550);
  $('#darkScene').classList.remove('active');
  $('#gardenScene').classList.add('active');
  makePetals();

  await sleep(1000);
  $('#cherry').classList.add('walkIn');
  await sleep(5900);
  $('#barkBubble').classList.add('show');
  $('#cherry').classList.add('happy');
  vibrate(40);

  await sleep(1500);
  $('#touchHint').classList.add('show');
}
function revealTitle(){
  if(finished) return;
  finished=true;
  $('#touchHint').classList.remove('show');
  $('#cherry').classList.remove('happy');
  $('#cherry').classList.add('spin');
  hearts(); vibrate(55);
  setTimeout(()=>$('#titleWrap').classList.add('show'),1500);
}
$('#gardenScene').addEventListener('pointerdown',e=>{
  if($('#touchHint').classList.contains('show') && !touched){
    touched=true;
    revealTitle();
  }
});
$('#skip').addEventListener('click',()=>{
  $('#darkScene').classList.remove('active');
  $('#gardenScene').classList.add('active');
  $('#cherry').classList.add('walkIn');
  $('#cherry').style.transition='none';
  $('#cherry').style.transform='translateX(-50%) scale(1)';
  $('#cherry').style.opacity='1';
  if(!document.querySelector('.petal')) makePetals();
  setTimeout(()=>$('#titleWrap').classList.add('show'),100);
  finished=true;
});
$('#startBtn').addEventListener('click',e=>{
  e.stopPropagation();
  $('#toast').classList.remove('show');
  void $('#toast').offsetWidth;
  $('#toast').classList.add('show');
  vibrate(35);
});
runIntro();
</script>
</body>
</html>
